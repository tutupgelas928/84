
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equation Solver</title>
    <meta name="description" content="Solve linear and quadratic equations.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
{% include head.html %}
</head>
<body data-page-name="Equation Solver" data-tool-id="equation">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Equation Solver</h1>
                <p class="tool-intro">Solve linear and quadratic equations.</p>
                
                <div class="tool-box">
                    <label>Equation Type</label>
                    <select id="equationType">
                        <option value="linear">Linear (ax + b = 0)</option>
                        <option value="quadratic">Quadratic (ax² + bx + c = 0)</option>
                    </select>
                    
                    <div id="linearInputs">
                        <label style="margin-top: 0.8rem;">a</label>
                        <input type="number" id="linA" value="2">
                        
                        <label style="margin-top: 0.8rem;">b</label>
                        <input type="number" id="linB" value="4">
                    </div>
                    
                    <div id="quadInputs" style="display: none;">
                        <label style="margin-top: 0.8rem;">a</label>
                        <input type="number" id="quadA" value="1">
                        
                        <label style="margin-top: 0.8rem;">b</label>
                        <input type="number" id="quadB" value="-5">
                        
                        <label style="margin-top: 0.8rem;">c</label>
                        <input type="number" id="quadC" value="6">
                    </div>
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="solve()">Solve</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Solution</label>
                    <div class="output-box" id="solutionOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        document.getElementById('equationType').addEventListener('change', function() {
            const type = this.value;
            document.getElementById('linearInputs').style.display = type === 'linear' ? 'block' : 'none';
            document.getElementById('quadInputs').style.display = type === 'quadratic' ? 'block' : 'none';
        });
        
        function solve() {
            const type = document.getElementById('equationType').value;
            
            if (type === 'linear') {
                const a = parseFloat(document.getElementById('linA').value);
                const b = parseFloat(document.getElementById('linB').value);
                
                if (a === 0) {
                    document.getElementById('solutionOutput').textContent = b === 0 ? 'Infinite solutions' : 'No solution';
                } else {
                    const x = -b / a;
                    document.getElementById('solutionOutput').textContent = `x = ${x}`;
                }
            } else {
                const a = parseFloat(document.getElementById('quadA').value);
                const b = parseFloat(document.getElementById('quadB').value);
                const c = parseFloat(document.getElementById('quadC').value);
                
                const discriminant = b * b - 4 * a * c;
                
                if (discriminant > 0) {
                    const x1 = (-b + Math.sqrt(discriminant)) / (2 * a);
                    const x2 = (-b - Math.sqrt(discriminant)) / (2 * a);
                    document.getElementById('solutionOutput').textContent = `x₁ = ${x1}\nx₂ = ${x2}`;
                } else if (discriminant === 0) {
                    const x = -b / (2 * a);
                    document.getElementById('solutionOutput').textContent = `x = ${x} (double root)`;
                } else {
                    const real = -b / (2 * a);
                    const imag = Math.sqrt(-discriminant) / (2 * a);
                    document.getElementById('solutionOutput').textContent = `x₁ = ${real} + ${imag}i\nx₂ = ${real} - ${imag}i`;
                }
            }
        }
    </script>
</body>
</html>
