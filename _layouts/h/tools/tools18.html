
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Number Calculator</title>
    <meta name="description" content="Operations with large numbers.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
{% include head.html %}
</head>
<body data-page-name="Big Number Calculator" data-tool-id="big-number">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Big Number Calculator</h1>
                <p class="tool-intro">Operations with large numbers.</p>
                
                <div class="tool-box">
                    <label>Number 1</label>
                    <input type="text" id="num1" placeholder="e.g., 12345678901234567890">
                    
                    <label style="margin-top: 0.8rem;">Number 2</label>
                    <input type="text" id="num2" placeholder="e.g., 98765432109876543210">
                    
                    <label style="margin-top: 0.8rem;">Operation</label>
                    <select id="operation">
                        <option value="add">Addition (+)</option>
                        <option value="subtract">Subtraction (-)</option>
                        <option value="multiply">Multiplication (×)</option>
                    </select>
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Result</label>
                    <div class="output-box" id="resultOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        function calculate() {
            const num1 = document.getElementById('num1').value.trim();
            const num2 = document.getElementById('num2').value.trim();
            const op = document.getElementById('operation').value;
            
            if (!num1 || !num2) { alert('Enter both numbers.'); return; }
            
            try {
                const a = BigInt(num1);
                const b = BigInt(num2);
                
                let result;
                if (op === 'add') result = a + b;
                else if (op === 'subtract') result = a - b;
                else result = a * b;
                
                document.getElementById('resultOutput').textContent = result.toString();
            } catch(e) {
                alert('Invalid number.');
            }
        }
    </script>
</body>
</html>
