
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Cropper</title>
    <meta name="description" content="Crop images in your browser.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
{% include head.html %}
</head>
<body data-page-name="Image Cropper" data-tool-id="image-cropper">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Image Cropper</h1>
                <p class="tool-intro">Crop images in your browser.</p>
                
                <div class="tool-box">
                    <label>Upload Image</label>
                    <input type="file" id="imageInput" accept="image/*" onchange="loadImage(event)">
                </div>
                
                <div class="tool-box">
                    <label>Preview</label>
                    <div style="text-align: center;">
                        <img id="preview" style="max-width: 100%; border-radius: 8px;">
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0.5rem; margin-top: 1rem;">
                        <div>
                            <label>X</label>
                            <input type="number" id="cropX" value="0" oninput="cropImage()">
                        </div>
                        <div>
                            <label>Y</label>
                            <input type="number" id="cropY" value="0" oninput="cropImage()">
                        </div>
                        <div>
                            <label>Width</label>
                            <input type="number" id="cropW" value="200" oninput="cropImage()">
                        </div>
                        <div>
                            <label>Height</label>
                            <input type="number" id="cropH" value="200" oninput="cropImage()">
                        </div>
                    </div>
                </div>
                
                <div class="tool-box">
                    <div style="text-align: center;">
                        <canvas id="canvas" style="max-width: 100%; border-radius: 8px;"></canvas>
                    </div>
                    
                    <div style="margin-top: 1rem;">
                        <button class="btn btn-primary" onclick="downloadCrop()">Download Cropped</button>
                    </div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        let originalImage = null;
        
        function loadImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                originalImage = new Image();
                originalImage.onload = function() {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('cropW').value = originalImage.width;
                    document.getElementById('cropH').value = originalImage.height;
                    cropImage();
                };
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function cropImage() {
            if (!originalImage) return;
            
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            const x = parseInt(document.getElementById('cropX').value) || 0;
            const y = parseInt(document.getElementById('cropY').value) || 0;
            const w = parseInt(document.getElementById('cropW').value) || 100;
            const h = parseInt(document.getElementById('cropH').value) || 100;
            
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(originalImage, x, y, w, h, 0, 0, w, h);
        }
        
        function downloadCrop() {
            const canvas = document.getElementById('canvas');
            const link = document.createElement('a');
            link.download = 'cropped-image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
