
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Generator</title>
    <meta name="description" content="Generate HTML tables from data.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
{% include head.html %}
</head>
<body data-page-name="Table Generator" data-tool-id="table-generator">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Table Generator</h1>
                <p class="tool-intro">Generate HTML table from data.</p>
                
                <div class="tool-box">
                    <label>Rows</label>
                    <input type="number" id="rows" value="3" min="1" max="20">
                    
                    <label style="margin-top: 0.8rem;">Columns</label>
                    <input type="number" id="cols" value="3" min="1" max="10">
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="generate()">Generate</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy HTML</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>HTML Table</label>
                    <div class="output-box" id="tableOutput">-</div>
                </div>
                
                <div class="tool-box">
                    <label>Preview</label>
                    <div id="preview" style="overflow-x: auto;"></div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        function generate() {
            const rows = parseInt(document.getElementById('rows').value) || 3;
            const cols = parseInt(document.getElementById('cols').value) || 3;
            
            let html = '<table border="1" style="border-collapse: collapse; width: 100%;">\n';
            
            html += '  <thead>\n    <tr>\n';
            for (let c = 0; c < cols; c++) {
                html += `      <th>Header ${c + 1}</th>\n`;
            }
            html += '    </tr>\n  </thead>\n';
            
            html += '  <tbody>\n';
            for (let r = 0; r < rows; r++) {
                html += '    <tr>\n';
                for (let c = 0; c < cols; c++) {
                    html += `      <td>Cell ${r + 1}-${c + 1}</td>\n`;
                }
                html += '    </tr>\n';
            }
            html += '  </tbody>\n</table>';
            
            document.getElementById('tableOutput').textContent = html;
            document.getElementById('preview').innerHTML = html;
        }
        
        function copyResult() {
            const t = document.getElementById('tableOutput').textContent;
            if (t === '-') { alert('Generate first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
        
        generate();
    </script>
</body>
</html>
