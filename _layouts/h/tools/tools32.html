
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to JSON Converter</title>
    <meta name="description" content="Convert CSV data to JSON format.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
{% include head.html %}
</head>
<body data-page-name="CSV to JSON" data-tool-id="csv-json">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>CSV to JSON Converter</h1>
                <p class="tool-intro">Convert CSV data to JSON format.</p>
                
                <div class="tool-box">
                    <label>CSV Input</label>
                    <textarea id="csvInput" placeholder="Paste CSV here..." style="font-family: monospace;"></textarea>
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="convert()">Convert</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy</button>
                        <button class="btn btn-secondary" onclick="sampleData()">Sample</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>JSON Output</label>
                    <div class="output-box" id="jsonOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        function convert() {
            const csv = document.getElementById('csvInput').value.trim();
            if (!csv) { alert('Paste CSV first.'); return; }
            
            const lines = csv.split('\n').filter(l => l.trim());
            const headers = lines[0].split(',').map(h => h.trim());
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const obj = {};
                headers.forEach((header, index) => {
                    obj[header] = values[index]?.trim() || '';
                });
                data.push(obj);
            }
            
            document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);
        }
        
        function copyResult() {
            const t = document.getElementById('jsonOutput').textContent;
            if (t === '-') { alert('Convert first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
        
        function sampleData() {
            document.getElementById('csvInput').value = 'name,email,age\nJohn,john@example.com,30\nJane,jane@example.com,25';
            convert();
        }
    </script>
</body>
</html>
