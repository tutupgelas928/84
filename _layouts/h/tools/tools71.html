
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator</title>
    <meta name="description" content="Generate unique UUIDs.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
{% include head.html %}
</head>
<body data-page-name="UUID Generator" data-tool-id="uuid-generator">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>UUID Generator</h1>
                <p class="tool-intro">Generate unique identifiers.</p>
                
                <div class="tool-box">
                    <label>UUID v4</label>
                    <div class="output-box" id="output">-</div>
                    
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="generate()">Generate</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy</button>
                    </div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        function generate() {
            const uuid = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
            document.getElementById('output').textContent = uuid;
        }
        
        function copyResult() {
            const t = document.getElementById('output').textContent;
            if (t === '-') { alert('Generate first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
        
        generate();
    </script>
</body>
</html>
