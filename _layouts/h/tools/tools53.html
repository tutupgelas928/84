
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Calculator</title>
    <meta name="description" content="Matrix operations.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
{% include head.html %}
</head>
<body data-page-name="Matrix Calculator" data-tool-id="matrix">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
        <details><summary>...</summary>
        {{content}}
        </details>
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Matrix Calculator</h1>
                <p class="tool-intro">Matrix operations (2x2).</p>
                
                <div class="tool-box">
                    <label>Matrix A (2x2)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <input type="number" id="a11" value="1" placeholder="a11">
                        <input type="number" id="a12" value="2" placeholder="a12">
                        <input type="number" id="a21" value="3" placeholder="a21">
                        <input type="number" id="a22" value="4" placeholder="a22">
                    </div>
                    
                    <label style="margin-top: 0.8rem;">Matrix B (2x2)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
                        <input type="number" id="b11" value="5" placeholder="b11">
                        <input type="number" id="b12" value="6" placeholder="b12">
                        <input type="number" id="b21" value="7" placeholder="b21">
                        <input type="number" id="b22" value="8" placeholder="b22">
                    </div>
                    
                    <label style="margin-top: 0.8rem;">Operation</label>
                    <select id="operation">
                        <option value="add">Addition</option>
                        <option value="subtract">Subtraction</option>
                        <option value="multiply">Multiplication</option>
                    </select>
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Result</label>
                    <div class="output-box" id="resultOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    
    {% include /ads/gobloggugel/default.html %}
{% include footer.html %}

    
    <script>
        function calculate() {
            const A = [
                [parseFloat(document.getElementById('a11').value), parseFloat(document.getElementById('a12').value)],
                [parseFloat(document.getElementById('a21').value), parseFloat(document.getElementById('a22').value)]
            ];
            
            const B = [
                [parseFloat(document.getElementById('b11').value), parseFloat(document.getElementById('b12').value)],
                [parseFloat(document.getElementById('b21').value), parseFloat(document.getElementById('b22').value)]
            ];
            
            const op = document.getElementById('operation').value;
            
            let result = [];
            
            if (op === 'add') {
                result = [
                    [A[0][0] + B[0][0], A[0][1] + B[0][1]],
                    [A[1][0] + B[1][0], A[1][1] + B[1][1]]
                ];
            } else if (op === 'subtract') {
                result = [
                    [A[0][0] - B[0][0], A[0][1] - B[0][1]],
                    [A[1][0] - B[1][0], A[1][1] - B[1][1]]
                ];
            } else {
                result = [
                    [A[0][0]*B[0][0] + A[0][1]*B[1][0], A[0][0]*B[0][1] + A[0][1]*B[1][1]],
                    [A[1][0]*B[0][0] + A[1][1]*B[1][0], A[1][0]*B[0][1] + A[1][1]*B[1][1]]
                ];
            }
            
            document.getElementById('resultOutput').textContent = 
                `| ${result[0][0]}  ${result[0][1]} |\n| ${result[1][0]}  ${result[1][1]} |`;
        }
    </script>
</body>
</html>
