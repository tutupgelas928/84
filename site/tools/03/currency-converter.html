<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <meta name="description" content="Convert currencies with manual exchange rates.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Currency Converter" data-category="utility" data-tool-id="currency-converter">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Currency Converter</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Amount</label>
                        <input type="number" id="amount" value="100" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Exchange Rate (1 unit = ?)</label>
                        <input type="number" id="exchangeRate" value="15000" min="0" step="0.0001">
                    </div>
                    <div>
                        <label>From Currency</label>
                        <input type="text" id="fromCurrency" value="USD" placeholder="USD">
                    </div>
                    <div>
                        <label>To Currency</label>
                        <input type="text" id="toCurrency" value="IDR" placeholder="IDR">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="convert()">Convert</button>
                    <button class="btn btn-secondary" onclick="swapCurrencies()">Swap</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Result</label>
                <div class="output-box" id="result">-</div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function convert() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const rate = parseFloat(document.getElementById('exchangeRate').value) || 0;
            const from = document.getElementById('fromCurrency').value || 'USD';
            const to = document.getElementById('toCurrency').value || 'IDR';
            
            const converted = amount * rate;
            
            document.getElementById('result').textContent = `${amount} ${from} = ${converted.toFixed(2)} ${to}`;
        }
        
        function swapCurrencies() {
            const from = document.getElementById('fromCurrency');
            const to = document.getElementById('toCurrency');
            const temp = from.value;
            from.value = to.value;
            to.value = temp;
            
            const rate = parseFloat(document.getElementById('exchangeRate').value) || 0;
            if (rate > 0) {
                document.getElementById('exchangeRate').value = (1 / rate).toFixed(6);
            }
            
            convert();
        }
        
        convert();
    </script>
</body>
</html>
