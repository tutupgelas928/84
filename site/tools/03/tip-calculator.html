<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <meta name="description" content="Calculate restaurant tips easily.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Tip Calculator" data-category="tax" data-tool-id="tip-calculator">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Tip Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Bill Amount</label>
                        <input type="number" id="billAmount" value="50" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Tip Percentage (%)</label>
                        <input type="number" id="tipPercent" value="15" min="0" step="0.5">
                    </div>
                    <div>
                        <label>Number of People</label>
                        <input type="number" id="people" value="2" min="1">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="tipAmount">-</div><div class="stat-label">Tip Amount</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalBill">-</div><div class="stat-label">Total</div></div>
                    <div class="stat-card"><div class="stat-number" id="perPerson">-</div><div class="stat-label">Per Person</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const bill = parseFloat(document.getElementById('billAmount').value) || 0;
            const tipPercent = parseFloat(document.getElementById('tipPercent').value) || 0;
            const people = parseInt(document.getElementById('people').value) || 1;
            
            const tipAmount = bill * (tipPercent / 100);
            const totalBill = bill + tipAmount;
            const perPerson = totalBill / people;
            
            document.getElementById('tipAmount').textContent = tipAmount.toFixed(2);
            document.getElementById('totalBill').textContent = totalBill.toFixed(2);
            document.getElementById('perPerson').textContent = perPerson.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
