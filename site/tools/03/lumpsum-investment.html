<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumpsum Investment Calculator</title>
    <meta name="description" content="Calculate returns on one-time investments.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Lumpsum Investment" data-category="investment" data-tool-id="lumpsum-investment">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Lumpsum Investment Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Investment Amount</label>
                        <input type="number" id="amount" value="10000" min="1">
                    </div>
                    <div>
                        <label>Expected Annual Return (%)</label>
                        <input type="number" id="annualRate" value="10" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Duration (Years)</label>
                        <input type="number" id="duration" value="10" min="1">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="finalValue">-</div><div class="stat-label">Final Value</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalReturns">-</div><div class="stat-label">Returns</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const annualRate = parseFloat(document.getElementById('annualRate').value) || 0;
            const years = parseInt(document.getElementById('duration').value) || 1;
            
            const finalValue = amount * Math.pow(1 + annualRate / 100, years);
            const returns = finalValue - amount;
            
            document.getElementById('finalValue').textContent = finalValue.toFixed(2);
            document.getElementById('totalReturns').textContent = returns.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
