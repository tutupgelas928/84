<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amortization Schedule</title>
    <meta name="description" content="Generate complete loan amortization schedule.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Amortization Schedule" data-category="loan" data-tool-id="amortization">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Amortization Schedule</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Loan Amount</label>
                        <input type="number" id="loanAmount" value="10000" min="1">
                    </div>
                    <div>
                        <label>Interest Rate (%)</label>
                        <input type="number" id="interestRate" value="6" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Term (Years)</label>
                        <input type="number" id="loanTerm" value="5" min="1">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="generateSchedule()">Generate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Schedule</label>
                <div class="output-box" id="scheduleOutput" style="max-height: 400px; overflow-y: auto;">-</div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function generateSchedule() {
            const amount = parseFloat(document.getElementById('loanAmount').value) || 0;
            const annualRate = parseFloat(document.getElementById('interestRate').value) || 0;
            const years = parseInt(document.getElementById('loanTerm').value) || 1;
            
            const monthlyRate = (annualRate / 100) / 12;
            const numPayments = years * 12;
            
            let payment;
            if (monthlyRate === 0) {
                payment = amount / numPayments;
            } else {
                payment = amount * monthlyRate * Math.pow(1 + monthlyRate, numPayments) / (Math.pow(1 + monthlyRate, numPayments) - 1);
            }
            
            let balance = amount;
            let schedule = 'Payment | Principal | Interest | Balance\n';
            schedule += '-'.repeat(50) + '\n';
            
            for (let i = 1; i <= Math.min(numPayments, 60); i++) {
                const interestPayment = balance * monthlyRate;
                const principalPayment = payment - interestPayment;
                balance -= principalPayment;
                schedule += `${i} | ${principalPayment.toFixed(2)} | ${interestPayment.toFixed(2)} | ${Math.max(0, balance).toFixed(2)}\n`;
            }
            
            if (numPayments > 60) {
                schedule += `... and ${numPayments - 60} more payments\n`;
            }
            
            document.getElementById('scheduleOutput').textContent = schedule;
        }
        
        generateSchedule();
    </script>
</body>
</html>
