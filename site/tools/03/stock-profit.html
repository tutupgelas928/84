<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Profit Calculator</title>
    <meta name="description" content="Calculate stock trading profits.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Stock Profit" data-category="investment" data-tool-id="stock-profit">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Stock Profit Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Buy Price</label>
                        <input type="number" id="buyPrice" value="100" min="0.01" step="0.01">
                    </div>
                    <div>
                        <label>Sell Price</label>
                        <input type="number" id="sellPrice" value="120" min="0.01" step="0.01">
                    </div>
                    <div>
                        <label>Number of Shares</label>
                        <input type="number" id="shares" value="100" min="1">
                    </div>
                    <div>
                        <label>Brokerage Fee</label>
                        <input type="number" id="fees" value="0" min="0" step="0.01">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="totalCost">-</div><div class="stat-label">Total Cost</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalRevenue">-</div><div class="stat-label">Revenue</div></div>
                    <div class="stat-card"><div class="stat-number" id="netProfit">-</div><div class="stat-label">Net Profit</div></div>
                    <div class="stat-card"><div class="stat-number" id="roi">-</div><div class="stat-label">ROI %</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
            const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
            const shares = parseInt(document.getElementById('shares').value) || 0;
            const fees = parseFloat(document.getElementById('fees').value) || 0;
            
            const totalCost = buy * shares;
            const totalRevenue = sell * shares;
            const netProfit = totalRevenue - totalCost - fees;
            const roi = (netProfit / totalCost) * 100;
            
            document.getElementById('totalCost').textContent = totalCost.toFixed(2);
            document.getElementById('totalRevenue').textContent = totalRevenue.toFixed(2);
            document.getElementById('netProfit').textContent = netProfit.toFixed(2);
            document.getElementById('roi').textContent = roi.toFixed(2) + '%';
        }
        
        calculate();
    </script>
</body>
</html>
