<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <meta name="description" content="Calculate simple interest on any principal amount.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Simple Interest" data-category="loan" data-tool-id="simple-interest">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Simple Interest Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Principal Amount</label>
                        <input type="number" id="principal" value="10000" min="1">
                    </div>
                    <div>
                        <label>Interest Rate (% per year)</label>
                        <input type="number" id="rate" value="5" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Time (Years)</label>
                        <input type="number" id="time" value="3" min="0" step="0.5">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="interest">-</div><div class="stat-label">Interest</div></div>
                    <div class="stat-card"><div class="stat-number" id="total">-</div><div class="stat-label">Total Amount</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const p = parseFloat(document.getElementById('principal').value) || 0;
            const r = parseFloat(document.getElementById('rate').value) || 0;
            const t = parseFloat(document.getElementById('time').value) || 0;
            
            const interest = p * (r / 100) * t;
            const total = p + interest;
            
            document.getElementById('interest').textContent = interest.toFixed(2);
            document.getElementById('total').textContent = total.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
