<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overtime Calculator</title>
    <meta name="description" content="Calculate overtime pay.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Overtime Calculator" data-category="utility" data-tool-id="overtime">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Overtime Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Regular Hourly Rate</label>
                        <input type="number" id="regularRate" value="20" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Overtime Hours</label>
                        <input type="number" id="overtimeHours" value="10" min="0" step="0.5">
                    </div>
                    <div>
                        <label>Overtime Multiplier</label>
                        <select id="multiplier">
                            <option value="1.5">1.5x (Standard)</option>
                            <option value="2">2x (Double time)</option>
                            <option value="2.5">2.5x (Holiday)</option>
                        </select>
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="overtimeRate">-</div><div class="stat-label">OT Rate</div></div>
                    <div class="stat-card"><div class="stat-number" id="overtimePay">-</div><div class="stat-label">OT Pay</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const regular = parseFloat(document.getElementById('regularRate').value) || 0;
            const hours = parseFloat(document.getElementById('overtimeHours').value) || 0;
            const multiplier = parseFloat(document.getElementById('multiplier').value);
            
            const overtimeRate = regular * multiplier;
            const overtimePay = overtimeRate * hours;
            
            document.getElementById('overtimeRate').textContent = overtimeRate.toFixed(2);
            document.getElementById('overtimePay').textContent = overtimePay.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
