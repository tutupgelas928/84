<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debt Payoff Calculator</title>
    <meta name="description" content="Create a debt payoff plan using snowball or avalanche method.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Debt Payoff" data-category="loan" data-tool-id="debt-payoff">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Debt Payoff Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <label>Total Debt</label>
                <input type="number" id="totalDebt" value="10000" min="1">
                
                <label style="margin-top: 0.8rem;">Average Interest Rate (%)</label>
                <input type="number" id="avgRate" value="18" min="0" step="0.01">
                
                <label style="margin-top: 0.8rem;">Monthly Payment</label>
                <input type="number" id="monthlyPayment" value="300" min="1">
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="monthsToPayoff">-</div><div class="stat-label">Months</div></div>
                    <div class="stat-card"><div class="stat-number" id="yearsToPayoff">-</div><div class="stat-label">Years</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalInterest">-</div><div class="stat-label">Total Interest</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            let balance = parseFloat(document.getElementById('totalDebt').value) || 0;
            const annualRate = parseFloat(document.getElementById('avgRate').value) || 0;
            const monthlyPayment = parseFloat(document.getElementById('monthlyPayment').value) || 0;
            
            const monthlyRate = (annualRate / 100) / 12;
            
            if (monthlyPayment <= balance * monthlyRate) {
                alert('Monthly payment is too low to pay off this debt.');
                return;
            }
            
            let months = 0;
            let totalInterest = 0;
            
            while (balance > 0 && months < 600) {
                const interest = balance * monthlyRate;
                totalInterest += interest;
                balance = balance + interest - monthlyPayment;
                months++;
            }
            
            document.getElementById('monthsToPayoff').textContent = months;
            document.getElementById('yearsToPayoff').textContent = (months / 12).toFixed(1);
            document.getElementById('totalInterest').textContent = totalInterest.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
