<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator</title>
    <meta name="description" content="Calculate any percentage instantly.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Percentage Calculator" data-category="tax" data-tool-id="percentage">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Percentage Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <label>Calculation Type</label>
                <select id="calcType" onchange="updateLabels()">
                    <option value="percentOf">What is X% of Y?</option>
                    <option value="percentChange">Percentage change from X to Y</option>
                    <option value="percentOfTotal">X is what % of Y?</option>
                </select>
                
                <div class="form-grid" style="margin-top: 0.8rem;">
                    <div>
                        <label id="label1">X</label>
                        <input type="number" id="value1" value="20" step="0.01">
                    </div>
                    <div>
                        <label id="label2">Y</label>
                        <input type="number" id="value2" value="100" step="0.01">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Result</label>
                <div class="output-box" id="result">-</div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function updateLabels() {
            const type = document.getElementById('calcType').value;
            const label1 = document.getElementById('label1');
            const label2 = document.getElementById('label2');
            
            if (type === 'percentOf') {
                label1.textContent = 'Percentage (%)';
                label2.textContent = 'Number';
            } else if (type === 'percentChange') {
                label1.textContent = 'From';
                label2.textContent = 'To';
            } else {
                label1.textContent = 'Part';
                label2.textContent = 'Whole';
            }
        }
        
        function calculate() {
            const type = document.getElementById('calcType').value;
            const v1 = parseFloat(document.getElementById('value1').value) || 0;
            const v2 = parseFloat(document.getElementById('value2').value) || 0;
            
            let result;
            
            if (type === 'percentOf') {
                result = (v1 / 100) * v2;
                document.getElementById('result').textContent = `${v1}% of ${v2} = ${result.toFixed(2)}`;
            } else if (type === 'percentChange') {
                result = ((v2 - v1) / v1) * 100;
                document.getElementById('result').textContent = `Change from ${v1} to ${v2} = ${result.toFixed(2)}%`;
            } else {
                result = (v1 / v2) * 100;
                document.getElementById('result').textContent = `${v1} is ${result.toFixed(2)}% of ${v2}`;
            }
        }
        
        updateLabels();
        calculate();
    </script>
</body>
</html>
