<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIP Calculator</title>
    <meta name="description" content="Calculate future value of regular monthly investments.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="SIP Calculator" data-category="investment" data-tool-id="sip-calculator">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>SIP Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Monthly Investment</label>
                        <input type="number" id="monthlyAmount" value="500" min="1">
                    </div>
                    <div>
                        <label>Expected Annual Return (%)</label>
                        <input type="number" id="annualRate" value="12" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Duration (Years)</label>
                        <input type="number" id="duration" value="10" min="1">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="totalInvested">-</div><div class="stat-label">Invested</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalValue">-</div><div class="stat-label">Final Value</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalReturns">-</div><div class="stat-label">Returns</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const monthly = parseFloat(document.getElementById('monthlyAmount').value) || 0;
            const annualRate = parseFloat(document.getElementById('annualRate').value) || 0;
            const years = parseInt(document.getElementById('duration').value) || 1;
            
            const monthlyRate = (annualRate / 100) / 12;
            const numPayments = years * 12;
            
            let futureValue;
            if (monthlyRate === 0) {
                futureValue = monthly * numPayments;
            } else {
                futureValue = monthly * (Math.pow(1 + monthlyRate, numPayments) - 1) / monthlyRate * (1 + monthlyRate);
            }
            
            const totalInvested = monthly * numPayments;
            const returns = futureValue - totalInvested;
            
            document.getElementById('totalInvested').textContent = totalInvested.toFixed(2);
            document.getElementById('totalValue').textContent = futureValue.toFixed(2);
            document.getElementById('totalReturns').textContent = returns.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
