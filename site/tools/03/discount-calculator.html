<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <meta name="description" content="Calculate discounts and final prices.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Discount Calculator" data-category="tax" data-tool-id="discount-calculator">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Discount Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Original Price</label>
                        <input type="number" id="originalPrice" value="100" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Discount (%)</label>
                        <input type="number" id="discount" value="20" min="0" max="100" step="0.01">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="discountAmount">-</div><div class="stat-label">You Save</div></div>
                    <div class="stat-card"><div class="stat-number" id="finalPrice">-</div><div class="stat-label">Final Price</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const price = parseFloat(document.getElementById('originalPrice').value) || 0;
            const discount = parseFloat(document.getElementById('discount').value) || 0;
            
            const discountAmount = price * (discount / 100);
            const finalPrice = price - discountAmount;
            
            document.getElementById('discountAmount').textContent = discountAmount.toFixed(2);
            document.getElementById('finalPrice').textContent = finalPrice.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
