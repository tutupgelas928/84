<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Calculator</title>
    <meta name="description" content="Calculate GST on any amount.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="GST Calculator" data-category="tax" data-tool-id="gst-calculator">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>GST Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Amount</label>
                        <input type="number" id="amount" value="100" min="0" step="0.01">
                    </div>
                    <div>
                        <label>GST Rate (%)</label>
                        <input type="number" id="gstRate" value="10" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Operation</label>
                        <select id="operation">
                            <option value="add">Add GST</option>
                            <option value="extract">Extract GST</option>
                        </select>
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="gstAmount">-</div><div class="stat-label">GST Amount</div></div>
                    <div class="stat-card"><div class="stat-number" id="baseAmount">-</div><div class="stat-label">Base</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalAmount">-</div><div class="stat-label">Total</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const rate = parseFloat(document.getElementById('gstRate').value) || 0;
            const operation = document.getElementById('operation').value;
            
            let gst, base, total;
            
            if (operation === 'add') {
                base = amount;
                gst = base * (rate / 100);
                total = base + gst;
            } else {
                total = amount;
                base = total / (1 + rate / 100);
                gst = total - base;
            }
            
            document.getElementById('gstAmount').textContent = gst.toFixed(2);
            document.getElementById('baseAmount').textContent = base.toFixed(2);
            document.getElementById('totalAmount').textContent = total.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
