<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markup Calculator</title>
    <meta name="description" content="Calculate product markup pricing.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Markup Calculator" data-category="tax" data-tool-id="markup-calculator">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Markup Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Cost Price</label>
                        <input type="number" id="costPrice" value="50" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Markup (%)</label>
                        <input type="number" id="markup" value="50" min="0" step="0.01">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="sellingPrice">-</div><div class="stat-label">Selling Price</div></div>
                    <div class="stat-card"><div class="stat-number" id="profit">-</div><div class="stat-label">Profit</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const cost = parseFloat(document.getElementById('costPrice').value) || 0;
            const markup = parseFloat(document.getElementById('markup').value) || 0;
            
            const profit = cost * (markup / 100);
            const sellingPrice = cost + profit;
            
            document.getElementById('sellingPrice').textContent = sellingPrice.toFixed(2);
            document.getElementById('profit').textContent = profit.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
