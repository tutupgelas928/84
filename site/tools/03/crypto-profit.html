<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Profit Calculator</title>
    <meta name="description" content="Calculate cryptocurrency trading profits.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Crypto Profit" data-category="investment" data-tool-id="crypto-profit">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Crypto Profit Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Buy Price</label>
                        <input type="number" id="buyPrice" value="50000" min="0.000001" step="0.000001">
                    </div>
                    <div>
                        <label>Sell Price</label>
                        <input type="number" id="sellPrice" value="60000" min="0.000001" step="0.000001">
                    </div>
                    <div>
                        <label>Quantity</label>
                        <input type="number" id="quantity" value="0.1" min="0.000001" step="0.000001">
                    </div>
                    <div>
                        <label>Exchange Fee (%)</label>
                        <input type="number" id="feeRate" value="0.1" min="0" step="0.01">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="totalCost">-</div><div class="stat-label">Cost</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalRevenue">-</div><div class="stat-label">Revenue</div></div>
                    <div class="stat-card"><div class="stat-number" id="netProfit">-</div><div class="stat-label">Profit</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
            const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
            const qty = parseFloat(document.getElementById('quantity').value) || 0;
            const feeRate = parseFloat(document.getElementById('feeRate').value) || 0;
            
            const totalCost = buy * qty;
            const totalRevenue = sell * qty;
            const buyFee = totalCost * (feeRate / 100);
            const sellFee = totalRevenue * (feeRate / 100);
            const netProfit = totalRevenue - totalCost - buyFee - sellFee;
            
            document.getElementById('totalCost').textContent = totalCost.toFixed(2);
            document.getElementById('totalRevenue').textContent = totalRevenue.toFixed(2);
            document.getElementById('netProfit').textContent = netProfit.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
