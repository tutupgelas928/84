<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inflation Calculator</title>
    <meta name="description" content="Calculate the impact of inflation on purchasing power.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Inflation Calculator" data-category="investment" data-tool-id="inflation">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Inflation Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Current Amount</label>
                        <input type="number" id="amount" value="10000" min="0">
                    </div>
                    <div>
                        <label>Inflation Rate (% per year)</label>
                        <input type="number" id="inflationRate" value="3" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Years</label>
                        <input type="number" id="years" value="10" min="1">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="futureValue">-</div><div class="stat-label">Future Value</div></div>
                    <div class="stat-card"><div class="stat-number" id="purchasingPower">-</div><div class="stat-label">Today's Value</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const amount = parseFloat(document.getElementById('amount').value) || 0;
            const rate = parseFloat(document.getElementById('inflationRate').value) || 0;
            const years = parseInt(document.getElementById('years').value) || 1;
            
            const futureValue = amount * Math.pow(1 + rate / 100, years);
            const purchasingPower = amount / Math.pow(1 + rate / 100, years);
            
            document.getElementById('futureValue').textContent = futureValue.toFixed(2);
            document.getElementById('purchasingPower').textContent = purchasingPower.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
