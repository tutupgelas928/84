<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest Calculator</title>
    <meta name="description" content="Calculate compound interest growth over time.">
    <link rel="stylesheet" href="/site/tools/03/style.css">
    <script src="/site/tools/03/config.js"></script>
    {% include head.html %}
</head>
<body data-page-name="Compound Interest" data-category="loan" data-tool-id="compound-interest">
    <details>
        <summary>___</summary>
        {{content}}
    </details>
    
    <div id="site-header"></div>
    
    <main class="main-content">
        <div id="breadcrumb"></div>
        
        <div class="tool-page">
            <h1>Compound Interest Calculator</h1>
            <p class="tool-intro" id="toolIntro"></p>
            
            <div class="tool-box">
                <div class="form-grid">
                    <div>
                        <label>Principal Amount</label>
                        <input type="number" id="principal" value="10000" min="1">
                    </div>
                    <div>
                        <label>Annual Interest Rate (%)</label>
                        <input type="number" id="rate" value="7" min="0" step="0.01">
                    </div>
                    <div>
                        <label>Time (Years)</label>
                        <input type="number" id="time" value="10" min="1">
                    </div>
                    <div>
                        <label>Compounding Frequency</label>
                        <select id="frequency">
                            <option value="1">Annually</option>
                            <option value="2">Semi-annually</option>
                            <option value="4">Quarterly</option>
                            <option value="12" selected>Monthly</option>
                            <option value="365">Daily</option>
                        </select>
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                </div>
            </div>
            
            <div class="tool-box">
                <label>Results</label>
                <div class="stats">
                    <div class="stat-card"><div class="stat-number" id="totalAmount">-</div><div class="stat-label">Total Amount</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalInterest">-</div><div class="stat-label">Total Interest</div></div>
                </div>
            </div>
            
            <div id="ad-content" class="ad-container"></div>
            
            <section class="content-section" id="toolExplanation"></section>
            <section class="content-section" id="toolTips"></section>
            <section class="content-section" id="toolFAQ"></section>
            
            <section class="content-section">
                <h2>Related Tools</h2>
                <div class="related-tools" id="related-tools"></div>
            </section>
        </div>
    </main>
    
    {% include /ads/gobloggugel/default.html %}
    {% include footer.html %}
    
    <script>
        function calculate() {
            const p = parseFloat(document.getElementById('principal').value) || 0;
            const r = parseFloat(document.getElementById('rate').value) || 0;
            const t = parseFloat(document.getElementById('time').value) || 1;
            const n = parseInt(document.getElementById('frequency').value);
            
            const amount = p * Math.pow(1 + (r / 100) / n, n * t);
            const interest = amount - p;
            
            document.getElementById('totalAmount').textContent = amount.toFixed(2);
            document.getElementById('totalInterest').textContent = interest.toFixed(2);
        }
        
        calculate();
    </script>
</body>
</html>
