<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Generator</title>
    <meta name="description" content="Generate prime numbers.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
</head>
<body data-page-name="Prime Generator" data-tool-id="prime-generator">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Prime Generator</h1>
                <p class="tool-intro">Generate prime numbers up to N.</p>
                
                <div class="tool-box">
                    <label>Up to Number</label>
                    <input type="number" id="limit" value="100" min="2" max="100000">
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="generatePrimes()">Generate</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Prime Numbers</label>
                    <div class="output-box" id="primeOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    <div id="site-footer"></div>
    
    <script>
        function generatePrimes() {
            const limit = parseInt(document.getElementById('limit').value) || 100;
            
            if (limit > 100000) { alert('Max 100000'); return; }
            
            const sieve = Array(limit + 1).fill(true);
            sieve[0] = sieve[1] = false;
            
            for (let i = 2; i * i <= limit; i++) {
                if (sieve[i]) {
                    for (let j = i * i; j <= limit; j += i) {
                        sieve[j] = false;
                    }
                }
            }
            
            const primes = [];
            for (let i = 2; i <= limit; i++) {
                if (sieve[i]) primes.push(i);
            }
            
            document.getElementById('primeOutput').textContent = primes.join(', ');
        }
        
        function copyResult() {
            const t = document.getElementById('primeOutput').textContent;
            if (t === '-') { alert('Generate first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
    </script>
</body>
</html>
