<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Analyzer</title>
    <meta name="description" content="Analyze password strength.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
</head>
<body data-page-name="Password Analyzer" data-tool-id="password-analyzer">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Password Analyzer</h1>
                <p class="tool-intro">Analyze password strength.</p>
                
                <div class="tool-box">
                    <label>Password</label>
                    <input type="text" id="password" placeholder="Enter password to analyze..." oninput="analyze()">
                    
                    <div style="margin-top: 1rem;">
                        <div id="strengthBar" style="height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden;">
                            <div id="strengthFill" style="height: 100%; width: 0%; transition: all 0.3s;"></div>
                        </div>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Results</label>
                    <div class="stats">
                        <div class="stat-card"><div class="stat-number" id="charCount">0</div><div class="stat-label">Characters</div></div>
                        <div class="stat-card"><div class="stat-number" id="upperCount">0</div><div class="stat-label">Uppercase</div></div>
                        <div class="stat-card"><div class="stat-number" id="lowerCount">0</div><div class="stat-label">Lowercase</div></div>
                        <div class="stat-card"><div class="stat-number" id="digitCount">0</div><div class="stat-label">Digits</div></div>
                        <div class="stat-card"><div class="stat-number" id="specialCount">0</div><div class="stat-label">Special</div></div>
                    </div>
                    
                    <label style="margin-top: 1rem;">Strength</label>
                    <div class="output-box" id="strengthResult">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    <div id="site-footer"></div>
    
    <script>
        function analyze() {
            const password = document.getElementById('password').value;
            if (!password) return;
            
            const length = password.length;
            const upper = (password.match(/[A-Z]/g) || []).length;
            const lower = (password.match(/[a-z]/g) || []).length;
            const digit = (password.match(/[0-9]/g) || []).length;
            const special = (password.match(/[^A-Za-z0-9]/g) || []).length;
            
            document.getElementById('charCount').textContent = length;
            document.getElementById('upperCount').textContent = upper;
            document.getElementById('lowerCount').textContent = lower;
            document.getElementById('digitCount').textContent = digit;
            document.getElementById('specialCount').textContent = special;
            
            let score = 0;
            if (length >= 8) score += 25;
            else if (length >= 6) score += 10;
            if (upper > 0) score += 20;
            if (lower > 0) score += 20;
            if (digit > 0) score += 20;
            if (special > 0) score += 15;
            
            const fill = document.getElementById('strengthFill');
            fill.style.width = score + '%';
            
            if (score >= 80) fill.style.background = 'var(--success)';
            else if (score >= 50) fill.style.background = 'var(--warning)';
            else fill.style.background = 'var(--danger)';
            
            let result = '';
            if (score >= 80) result = 'STRONG password';
            else if (score >= 50) result = 'MODERATE password';
            else if (score >= 25) result = 'WEAK password';
            else result = 'VERY WEAK password';
            
            document.getElementById('strengthResult').textContent = `${result} (Score: ${score}/100)`;
        }
    </script>
</body>
</html>
