<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Calculator</title>
    <meta name="description" content="Calculate Fibonacci sequence.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
</head>
<body data-page-name="Fibonacci Calculator" data-tool-id="fibonacci">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Fibonacci Calculator</h1>
                <p class="tool-intro">Calculate Fibonacci sequence.</p>
                
                <div class="tool-box">
                    <label>Number of Terms</label>
                    <input type="number" id="terms" value="10" min="1" max="100">
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="calculate()">Calculate</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Fibonacci Sequence</label>
                    <div class="output-box" id="fibOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    <div id="site-footer"></div>
    
    <script>
        function calculate() {
            const n = parseInt(document.getElementById('terms').value) || 10;
            
            if (n > 100) { alert('Max 100 terms'); return; }
            
            const fib = [0, 1];
            for (let i = 2; i < n; i++) {
                fib.push(fib[i-1] + fib[i-2]);
            }
            
            document.getElementById('fibOutput').textContent = fib.slice(0, n).join(', ');
        }
        
        function copyResult() {
            const t = document.getElementById('fibOutput').textContent;
            if (t === '-') { alert('Calculate first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
    </script>
</body>
</html>
