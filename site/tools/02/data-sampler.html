<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sampler</title>
    <meta name="description" content="Sample random data from dataset.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
</head>
<body data-page-name="Data Sampler" data-tool-id="data-sampler">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Data Sampler</h1>
                <p class="tool-intro">Sample random data from dataset.</p>
                
                <div class="tool-box">
                    <label>Dataset (one item per line)</label>
                    <textarea id="dataset" placeholder="Item 1&#10;Item 2&#10;Item 3&#10;..."></textarea>
                    
                    <label style="margin-top: 0.8rem;">Sample Size</label>
                    <input type="number" id="sampleSize" value="3" min="1" max="100">
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="sample()">Sample</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy</button>
                        <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Sampled Data</label>
                    <div class="output-box" id="sampleOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    <div id="site-footer"></div>
    
    <script>
        function sample() {
            const dataset = document.getElementById('dataset').value.split('\n').filter(l => l.trim());
            const size = parseInt(document.getElementById('sampleSize').value) || 1;
            
            if (dataset.length === 0) { alert('Enter dataset.'); return; }
            if (size > dataset.length) { alert('Sample size larger than dataset.'); return; }
            
            const shuffled = [...dataset].sort(() => Math.random() - 0.5);
            const sampled = shuffled.slice(0, size);
            
            document.getElementById('sampleOutput').textContent = sampled.join('\n');
        }
        
        function copyResult() {
            const t = document.getElementById('sampleOutput').textContent;
            if (t === '-') { alert('Sample first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
        
        function clearAll() {
            document.getElementById('dataset').value = '';
            document.getElementById('sampleOutput').textContent = '-';
        }
    </script>
</body>
</html>
