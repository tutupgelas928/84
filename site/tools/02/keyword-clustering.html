<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyword Clustering</title>
    <meta name="description" content="Group similar keywords.">
    <link rel="stylesheet" href="/site/tools/02/style.css">
    <script src="/site/tools/02/config.js"></script>
</head>
<body data-page-name="Keyword Clustering" data-tool-id="keyword-clustering">
    <div id="site-header"></div>
    
    <div class="layout">
        <div id="site-sidebar"></div>
        
        <main class="main-content">
            <div id="breadcrumb"></div>
            
            <div class="tool-page">
                <h1>Keyword Clustering</h1>
                <p class="tool-intro">Group similar keywords.</p>
                
                <div class="tool-box">
                    <label>Keywords (one per line)</label>
                    <textarea id="keywords" placeholder="keyword 1&#10;keyword 2&#10;keyword 3&#10;..."></textarea>
                    
                    <div style="margin-top: 0.8rem;">
                        <button class="btn btn-primary" onclick="cluster()">Cluster</button>
                        <button class="btn btn-copy" onclick="copyResult()">Copy</button>
                        <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
                    </div>
                </div>
                
                <div class="tool-box">
                    <label>Clusters</label>
                    <div class="output-box" id="clusterOutput">-</div>
                </div>
                
                <div id="ad-content" class="ad-container"></div>
                
                <section class="content-section">
                    <h2>Related Tools</h2>
                    <div class="related-tools" id="related-tools"></div>
                </section>
            </div>
        </main>
    </div>
    
    <div id="site-footer"></div>
    
    <script>
        function cluster() {
            const keywords = document.getElementById('keywords').value.split('\n').filter(k => k.trim());
            
            if (keywords.length === 0) { alert('Enter keywords.'); return; }
            
            const clusters = {};
            
            keywords.forEach(keyword => {
                const words = keyword.toLowerCase().split(/\s+/);
                const root = words[0];
                
                if (!clusters[root]) clusters[root] = [];
                clusters[root].push(keyword.trim());
            });
            
            let result = '';
            Object.entries(clusters).forEach(([root, group]) => {
                result += `\n[${root}] (${group.length} keywords)\n`;
                group.forEach(k => result += `  - ${k}\n`);
            });
            
            document.getElementById('clusterOutput').textContent = result;
        }
        
        function copyResult() {
            const t = document.getElementById('clusterOutput').textContent;
            if (t === '-') { alert('Cluster first.'); return; }
            navigator.clipboard.writeText(t).then(() => alert('Copied!'));
        }
        
        function clearAll() {
            document.getElementById('keywords').value = '';
            document.getElementById('clusterOutput').textContent = '-';
        }
    </script>
</body>
</html>
